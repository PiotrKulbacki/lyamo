name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Prepare dependencies
        uses: ./.github/actions/setup-ci
      - name: Format, lint, typecheck and unit tests
        run: npm run test:quality

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Prepare dependencies
        uses: ./.github/actions/setup-ci
      - name: Restore Next.js compiler cache
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: next-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-
      - name: Build on isolated PostgreSQL
        run: npm run build:test
      - name: Auth PostgreSQL integration
        run: npm run test:integration

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LYAMO_TEST_BROWSER_CHANNEL: chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Prepare dependencies
        uses: ./.github/actions/setup-ci
      - name: Verify preinstalled Chrome
        run: google-chrome --version
      - name: Browser smoke test
        run: npm run test:e2e

  # Keep the existing required check green only when every verification passed.
  quality:
    if: ${{ always() }}
    needs: [checks, build, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all verification jobs
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$BROWSER_RESULT" = success
